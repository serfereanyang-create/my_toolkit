<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>后台真实输入验收</title>
<style>body{margin:0;min-height:720px;background:#111318;color:#fafafa;font:18px "Microsoft YaHei",sans-serif}h1{position:absolute;left:40px;top:28px;margin:0;font-size:30px}input,button{box-sizing:border-box;font:inherit;border-radius:8px;padding:10px;border:1px solid #666}input{position:absolute;left:40px;width:300px;height:48px;background:#292e37;color:white}#first{top:140px}#second{top:238px}button{position:absolute;top:340px;left:40px;background:white;color:#17191d}#zoom{left:400px}canvas{position:absolute;left:400px;top:140px;width:480px;height:280px;border-radius:12px}#state{position:absolute;left:40px;top:432px;width:880px;white-space:pre-wrap;overflow-wrap:anywhere;color:#b7c7d7;font:16px/1.7 Consolas,monospace}#covered{top:620px}#cover{position:absolute;left:40px;top:620px;width:300px;height:48px;background:#555}</style>
<h1>后台输入 · 真实键盘与 Canvas</h1><form id="form"><input id="first" aria-label="第一个输入框" value="initial value"><input id="second" aria-label="第二个输入框"><button id="submit">提交</button></form><button id="zoom" type="button" style="left:160px">放大 150%</button><canvas id="surface" width="480" height="280" tabindex="0"></canvas><pre id="state"></pre><button id="covered">不应被点击</button><div id="cover">覆盖层</div><input id="private-password" type="password" value="private-password-fixture" style="display:none"><input id="private-token" type="hidden" value="private-token-fixture">
<script>
const first=document.querySelector('#first'),second=document.querySelector('#second'),surface=document.querySelector('#surface');
const state={first:first.value,second:'',active:'',trustedInputs:0,pointers:0,doubleClicks:0,rightClicks:0,submitted:0,coveredClicks:0,zoom:devicePixelRatio};
function render(){state.first=first.value;state.second=second.value;state.active=document.activeElement.id;state.zoom=devicePixelRatio;document.querySelector('#state').textContent='STATE: '+JSON.stringify(state);}
function draw(){const context=surface.getContext('2d');context.fillStyle=state.pointers?'#24573f':'#493037';context.fillRect(0,0,480,280);context.fillStyle='#fff';context.font='24px sans-serif';context.fillText('Canvas clicks: '+state.pointers,36,90);context.fillText('Trusted renderer input',36,150);}
document.addEventListener('input',event=>{if(event.isTrusted)state.trustedInputs++;render();});document.addEventListener('focusin',render);document.addEventListener('keyup',render);window.addEventListener('resize',render);
surface.addEventListener('pointerdown',event=>{if(event.isTrusted){state.pointers++;draw();render();}});surface.addEventListener('dblclick',event=>{if(event.isTrusted){state.doubleClicks++;render();}});surface.addEventListener('contextmenu',event=>{event.preventDefault();if(event.isTrusted){state.rightClicks++;render();}});
document.querySelector('#form').addEventListener('submit',event=>{event.preventDefault();if(event.isTrusted)state.submitted++;render();});document.querySelector('#zoom').addEventListener('click',async()=>{await window.nativeReview.zoom();render();});document.querySelector('#covered').addEventListener('click',()=>{state.coveredClicks++;render();});draw();render();
</script></html>
