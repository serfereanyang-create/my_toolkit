<svg width="1024" height="1024" viewBox="0 0 1024 1024" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- YOYcode brand: 3D wireframe atom on a full-bleed deep-navy plate.
       No white tile — the object sits directly on the dark background. -->
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#17466f"/>
      <stop offset="55%" stop-color="#0e3252"/>
      <stop offset="100%" stop-color="#0a2340"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="42%" r="55%">
      <stop offset="0%" stop-color="#64a9e2" stop-opacity="0.30"/>
      <stop offset="60%" stop-color="#64a9e2" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#64a9e2" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vignette" cx="50%" cy="46%" r="72%">
      <stop offset="62%" stop-color="#04101f" stop-opacity="0"/>
      <stop offset="100%" stop-color="#04101f" stop-opacity="0.38"/>
    </radialGradient>
    <linearGradient id="orbitGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#a5d2f2"/>
      <stop offset="45%" stop-color="#79b5e3"/>
      <stop offset="100%" stop-color="#4f8fc2"/>
    </linearGradient>
    <radialGradient id="ballGrad" cx="35%" cy="30%" r="80%">
      <stop offset="0%" stop-color="#eef7ff"/>
      <stop offset="35%" stop-color="#a9d2f1"/>
      <stop offset="70%" stop-color="#5f9fd2"/>
      <stop offset="100%" stop-color="#356f9f"/>
    </radialGradient>
    <filter id="softBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
  </defs>

  <!-- background plate -->
  <rect width="1024" height="1024" fill="url(#bgGrad)"/>
  <circle cx="512" cy="450" r="500" fill="url(#glow)"/>

  <!-- cast shadow of the whole atom -->
  <g transform="translate(512,534)" filter="url(#softBlur)" opacity="0.5">
    <ellipse rx="382" ry="152" transform="rotate(0)" stroke="#04101f" stroke-width="58" fill="none"/>
    <ellipse rx="382" ry="152" transform="rotate(60)" stroke="#04101f" stroke-width="58" fill="none"/>
    <ellipse rx="382" ry="152" transform="rotate(120)" stroke="#04101f" stroke-width="58" fill="none"/>
  </g>

  <!-- atom: three orbits, extruded + gradient face + top rim light -->
  <g transform="translate(512,512)">
    <g transform="rotate(0)">
      <ellipse rx="382" ry="152" stroke="#255d8c" stroke-width="62" fill="none" transform="translate(0,12)"/>
      <ellipse rx="382" ry="152" stroke="url(#orbitGrad)" stroke-width="56" fill="none"/>
      <ellipse rx="382" ry="152" stroke="#d3e9fb" stroke-width="12" fill="none" opacity="0.5" transform="translate(0,-16)"/>
    </g>
    <g transform="rotate(60)">
      <ellipse rx="382" ry="152" stroke="#255d8c" stroke-width="62" fill="none" transform="translate(0,12)"/>
      <ellipse rx="382" ry="152" stroke="url(#orbitGrad)" stroke-width="56" fill="none"/>
      <ellipse rx="382" ry="152" stroke="#d3e9fb" stroke-width="12" fill="none" opacity="0.5" transform="translate(0,-16)"/>
    </g>
    <g transform="rotate(120)">
      <ellipse rx="382" ry="152" stroke="#255d8c" stroke-width="62" fill="none" transform="translate(0,12)"/>
      <ellipse rx="382" ry="152" stroke="url(#orbitGrad)" stroke-width="56" fill="none"/>
      <ellipse rx="382" ry="152" stroke="#d3e9fb" stroke-width="12" fill="none" opacity="0.5" transform="translate(0,-16)"/>
    </g>

    <!-- electron spheres at hexagon vertices -->
    <g>
      <circle cx="0" cy="-352" r="62" fill="url(#ballGrad)"/>
      <circle cx="-305" cy="-176" r="62" fill="url(#ballGrad)"/>
      <circle cx="-305" cy="176" r="62" fill="url(#ballGrad)"/>
      <circle cx="0" cy="352" r="62" fill="url(#ballGrad)"/>
      <circle cx="305" cy="176" r="62" fill="url(#ballGrad)"/>
      <circle cx="305" cy="-176" r="62" fill="url(#ballGrad)"/>
      <!-- specular highlights -->
      <ellipse cx="-20" cy="-372" rx="17" ry="12" fill="#ffffff" opacity="0.75"/>
      <ellipse cx="-325" cy="-196" rx="17" ry="12" fill="#ffffff" opacity="0.75"/>
      <ellipse cx="-325" cy="156" rx="17" ry="12" fill="#ffffff" opacity="0.75"/>
      <ellipse cx="-20" cy="332" rx="17" ry="12" fill="#ffffff" opacity="0.75"/>
      <ellipse cx="285" cy="156" rx="17" ry="12" fill="#ffffff" opacity="0.75"/>
      <ellipse cx="285" cy="-196" rx="17" ry="12" fill="#ffffff" opacity="0.75"/>
    </g>

    <!-- nucleus -->
    <circle r="82" fill="url(#ballGrad)"/>
    <ellipse cx="-26" cy="-30" rx="24" ry="17" fill="#ffffff" opacity="0.8"/>
  </g>

  <rect width="1024" height="1024" fill="url(#vignette)"/>
</svg>
