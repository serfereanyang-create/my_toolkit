<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#263238"/>
    </marker>
    <style>
      .title { font: 700 28px "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; fill: #14212b; }
      .section { font: 700 22px "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; fill: #263238; }
      .label { font: 18px "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; fill: #263238; }
      .small { font: 16px "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; fill: #455a64; }
      .formula { font: 22px Cambria, "Times New Roman", serif; fill: #14212b; }
      .wire { stroke: #263238; stroke-width: 3; fill: none; }
      .power { stroke: #d84315; stroke-width: 4; fill: none; }
      .cold { stroke: #1976d2; stroke-width: 4; fill: none; }
      .warm { stroke: #ef6c00; stroke-width: 4; fill: none; }
      .dash { stroke: #90a4ae; stroke-width: 2; stroke-dasharray: 7 6; fill: none; }
      .box { fill: #f7fafc; stroke: #b0bec5; stroke-width: 2; rx: 10; }
    </style>
  </defs>
  <rect width="1200" height="900" fill="white"/>
  <text x="600" y="42" text-anchor="middle" class="title">ESP32-C3 双路 PWM 冷暖光控制示意图</text>

  <rect x="35" y="70" width="1130" height="365" class="box"/>
  <text x="60" y="105" class="section">一、低端 MOSFET 驱动电路</text>

  <text x="210" y="140" text-anchor="middle" class="label" fill="#d84315">+5 V LED 电源</text>
  <line x1="210" y1="150" x2="210" y2="180" class="power"/>
  <line x1="680" y1="150" x2="680" y2="180" class="power"/>
  <line x1="210" y1="150" x2="680" y2="150" class="power"/>

  <rect x="170" y="180" width="80" height="42" fill="#fff3e0" stroke="#ef6c00" stroke-width="2" rx="5"/>
  <text x="210" y="207" text-anchor="middle" class="label">R<tspan baseline-shift="sub" font-size="13">c</tspan></text>
  <line x1="210" y1="222" x2="210" y2="245" class="wire"/>
  <polygon points="195,245 225,245 210,275" fill="#e3f2fd" stroke="#1976d2" stroke-width="2"/>
  <line x1="210" y1="275" x2="210" y2="300" class="wire"/>
  <text x="210" y="326" text-anchor="middle" class="label" fill="#1976d2">冷白 LED</text>
  <line x1="210" y1="335" x2="210" y2="355" class="wire"/>
  <rect x="165" y="355" width="90" height="52" fill="#e3f2fd" stroke="#1976d2" stroke-width="2" rx="6"/>
  <text x="210" y="387" text-anchor="middle" class="label">MOSFET1</text>
  <line x1="210" y1="407" x2="210" y2="420" class="wire"/>

  <rect x="640" y="180" width="80" height="42" fill="#fff3e0" stroke="#ef6c00" stroke-width="2" rx="5"/>
  <text x="680" y="207" text-anchor="middle" class="label">R<tspan baseline-shift="sub" font-size="13">w</tspan></text>
  <line x1="680" y1="222" x2="680" y2="245" class="wire"/>
  <polygon points="665,245 695,245 680,275" fill="#fff3e0" stroke="#ef6c00" stroke-width="2"/>
  <line x1="680" y1="275" x2="680" y2="300" class="wire"/>
  <text x="680" y="326" text-anchor="middle" class="label" fill="#ef6c00">暖白 LED</text>
  <line x1="680" y1="335" x2="680" y2="355" class="wire"/>
  <rect x="635" y="355" width="90" height="52" fill="#fff3e0" stroke="#ef6c00" stroke-width="2" rx="6"/>
  <text x="680" y="387" text-anchor="middle" class="label">MOSFET2</text>
  <line x1="680" y1="407" x2="680" y2="420" class="wire"/>

  <line x1="210" y1="420" x2="680" y2="420" class="wire"/>
  <line x1="445" y1="420" x2="445" y2="438" class="wire"/>
  <line x1="410" y1="438" x2="480" y2="438" class="wire"/>
  <line x1="420" y1="446" x2="470" y2="446" class="wire"/>
  <line x1="430" y1="454" x2="460" y2="454" class="wire"/>
  <text x="500" y="455" class="label">GND</text>

  <line x1="85" y1="381" x2="165" y2="381" class="cold" marker-end="url(#arrow)"/>
  <text x="60" y="365" class="label" fill="#1976d2">GPIO1</text>
  <text x="60" y="388" class="small" fill="#1976d2">PWM<tspan baseline-shift="sub" font-size="12">冷</tspan></text>
  <line x1="805" y1="381" x2="725" y2="381" class="warm" marker-end="url(#arrow)"/>
  <text x="815" y="365" class="label" fill="#ef6c00">GPIO2</text>
  <text x="815" y="388" class="small" fill="#ef6c00">PWM<tspan baseline-shift="sub" font-size="12">暖</tspan></text>

  <text x="935" y="190" class="small">PWM 高电平：MOSFET 导通</text>
  <text x="935" y="220" class="small">PWM 低电平：MOSFET 截止</text>
  <text x="935" y="270" class="formula">D = T<tspan baseline-shift="sub" font-size="14">on</tspan> / T</text>
  <text x="935" y="305" class="small">D 为高电平时间占一个周期的比例</text>
  <text x="935" y="350" class="formula">0 ≤ D ≤ 1</text>

  <rect x="35" y="465" width="1130" height="385" class="box"/>
  <text x="60" y="500" class="section">二、两路 PWM 波形与占空比</text>
  <text x="60" y="540" class="label" fill="#1976d2">冷白 PWM（GPIO1）</text>
  <line x1="180" y1="555" x2="180" y2="635" class="dash"/>
  <line x1="180" y1="595" x2="1080" y2="595" class="dash"/>
  <path d="M180 595 L180 555 L720 555 L720 595 L1080 595 L1080 555" class="cold"/>
  <text x="225" y="548" class="small" fill="#1976d2">T<tspan baseline-shift="sub" font-size="12">on,c</tspan></text>
  <line x1="180" y1="650" x2="720" y2="650" class="cold" marker-end="url(#arrow)"/>
  <text x="450" y="675" text-anchor="middle" class="formula">D<tspan baseline-shift="sub" font-size="14">c</tspan> = T<tspan baseline-shift="sub" font-size="14">on,c</tspan> / T</text>
  <line x1="720" y1="650" x2="1080" y2="650" class="dash"/>
  <text x="820" y="675" class="small">低电平时间</text>

  <text x="60" y="715" class="label" fill="#ef6c00">暖白 PWM（GPIO2）</text>
  <line x1="180" y1="730" x2="180" y2="810" class="dash"/>
  <line x1="180" y1="770" x2="1080" y2="770" class="dash"/>
  <path d="M180 770 L180 730 L405 730 L405 770 L1080 770 L1080 730" class="warm"/>
  <text x="225" y="722" class="small" fill="#ef6c00">T<tspan baseline-shift="sub" font-size="12">on,w</tspan></text>
  <line x1="180" y1="825" x2="405" y2="825" class="warm" marker-end="url(#arrow)"/>
  <text x="292" y="850" text-anchor="middle" class="formula">D<tspan baseline-shift="sub" font-size="14">w</tspan> = T<tspan baseline-shift="sub" font-size="14">on,w</tspan> / T</text>
  <line x1="405" y1="825" x2="1080" y2="825" class="dash"/>
  <text x="675" y="850" class="small">低电平时间</text>

  <text x="950" y="525" class="formula">B = (D<tspan baseline-shift="sub" font-size="14">c</tspan> + D<tspan baseline-shift="sub" font-size="14">w</tspan>) / 2</text>
  <text x="950" y="555" class="formula">k = D<tspan baseline-shift="sub" font-size="14">c</tspan> / (D<tspan baseline-shift="sub" font-size="14">c</tspan> + D<tspan baseline-shift="sub" font-size="14">w</tspan>)</text>
</svg>
